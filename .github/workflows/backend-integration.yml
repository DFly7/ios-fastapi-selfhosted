name: Backend Integration Tests

# Not on pull_request — Backend CI unit tests cover PRs. Integration runs on
# push to main (and workflow_dispatch) to save Actions minutes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres_test
          JWT_SECRET: testsecretatleast32charslong1234
        run: uv run alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres_test
          JWT_SECRET: testsecretatleast32charslong1234
        run: uv run pytest tests/integration/ -m integration -v
