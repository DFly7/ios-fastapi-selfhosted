# Local-dev overlay: hot-reload the backend on source edits.
#
# Applied explicitly by scripts/dev.sh:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Deliberately NOT named docker-compose.override.yml — that would be picked up by any bare
# `docker compose up` in this directory, including a deploy checkout, silently shipping a
# bind mount and --reload to production.
#
# Only `app/` and `alembic/` are mounted, never the whole `backend/` directory: the host has a
# macOS `backend/.venv` that would shadow the container's Linux venv at /app/.venv.
services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      ENVIRONMENT: development
